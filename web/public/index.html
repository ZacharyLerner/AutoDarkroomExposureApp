<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Darkroom Exposure</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<main>
  <header class="top"><h1>Darkroom Exposure</h1><nav><a href="/prints.html">Prints</a> · <a href="/settings.html">Settings</a></nav></header>

  <form class="card" id="b">
    <h2>Benchmark print</h2>
    <label class="photo"><canvas role="img" aria-label="Benchmark print preview" hidden></canvas><span>Tap to add a photo of the negative you printed</span><input type="file" accept="image/*"></label>
    <div class="tools" hidden><button type="button" class="rot">Rotate ↺</button> <button type="button" class="box">Box 3:2</button></div><input type="hidden" name="rotation" value="0"><input type="hidden" name="portrait" value="0"><input type="hidden" name="pan_x" value="0"><input type="hidden" name="pan_y" value="0">
    <p class="note meta"></p>
    <div class="grid">
      <label class="f">Time (s)<input name="time" type="number" min="0" step="0.1" inputmode="decimal"></label>
      <label class="f">Height (in)<input name="height" type="number" min="0" step="0.125" inputmode="decimal"></label>
      <label class="f">Aperture<select name="aperture"></select></label>
      <label class="f">Filter<select name="grade"></select></label>
    </div>
    <label class="f wide">Preview brightness: match it to your print <output>±0</output><input name="brightness" type="range" min="-3" max="3" step="0.3333333" value="0"></label>
    <p class="note" id="bStatus">Nothing saved yet.</p>
    <button type="button" id="bDelete" hidden>Delete benchmark</button>
  </form>

  <form class="card" id="n">
    <h2>New negative</h2>
    <label class="photo"><canvas role="img" aria-label="New print preview" hidden></canvas><span>Tap to add a photo of the new negative (same phone and light)</span><input type="file" accept="image/*"></label>
    <div class="tools" hidden><button type="button" class="rot">Rotate ↺</button> <button type="button" class="box">Box 3:2</button></div><input type="hidden" name="rotation" value="0"><input type="hidden" name="portrait" value="0"><input type="hidden" name="pan_x" value="0"><input type="hidden" name="pan_y" value="0">
    <p class="note meta"></p>
    <div class="grid">
      <label class="f">Height (in)<input name="height" type="number" min="0" step="0.125" inputmode="decimal"></label>
      <label class="f">Aperture<select name="aperture"><option value="">Same</option></select></label>
      <label class="f">Filter<select name="grade"></select></label>
    </div>
    <label class="f wide">Preview brightness <output>±0</output><input name="brightness" type="range" min="-3" max="3" step="0.3333333" value="0"></label>
  </form>

  <section class="card" aria-live="polite">
    <div class="time" id="rTime">--</div>
    <table id="rTable"></table>
    <p class="note" id="rNote"></p>
    <button type="button" id="savePrint" hidden>Save to prints</button>
  </section>
</main>

<script src="common.js"></script>
<script>
const card = (id) => ({ form: $(id), img: $(id).querySelector('canvas'), analysis: null, file: null, exif: {}, neg: null });
const B = card('b'), N = card('n');
fillSelects(B.form, 8);
fillSelects(N.form, null);
for (const c of [B, N]) { onRotate(c.form, c.form.querySelector('.rot')); onBox(c.form, c.form.querySelector('.box')); }
enablePan(B.img, B.form, () => look(B), () => B.form.dispatchEvent(new Event('input'))); // saving re-measures on the server
enablePan(N.img, N.form, () => look(N), () => measureN());

// Photo + its phone settings (the server's small copy has no EXIF) + crop placement.
function photoForm(c) {
  const fd = new FormData();
  fd.append('file', c.file, 'photo.jpg');
  for (const [k, v] of Object.entries(c.exif)) if (v) fd.append(k, v);
  for (const k of ['pan_x', 'pan_y', 'rotation']) fd.append(k, c.form[k].value);
  fd.append('portrait', c.form.portrait.value === '1');
  return fd;
}

// The new negative lives only in this page, so re-send it to measure the moved crop window.
async function measureN() {
  if (!N.file) return;
  try { N.analysis = await api('/analyze', { method: 'POST', body: photoForm(N) }); look(N); compute(); }
  catch (err) { N.form.querySelector('.meta').textContent = err.message; }
}

function look(c) {
  const p = readPrint(c.form);
  c.form.querySelector('output').value = signed(p.brightness, ' stops');
  c.form.querySelector('.box').textContent = boxLabel(p);
  if (c.neg && c.analysis) renderPrint(c.img, c.neg, c.analysis.log_mean, p.brightness, p.grade); // first: sizes the canvas
  placeRotated(c.img, p.rotation, p.pan_x, p.pan_y, p.portrait);
}

async function showPhoto(c, src, a) {
  c.analysis = a;
  const meta = c.form.querySelector('.meta');
  meta.textContent = exifLine(a);
  try { c.neg = await loadNegative(src); } catch (err) { meta.textContent = err.message; return; }
  c.img.hidden = false;
  c.form.querySelector('.tools').hidden = false;
  c.form.querySelector('.photo span').hidden = true;
  look(c);
}

function upload(c, path, method) {
  c.form.querySelector('input[type=file]').onchange = async (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const meta = c.form.querySelector('.meta');
    meta.textContent = 'Reading photo…';
    try {
      const fd = photoForm({ ...c, file, exif: {} }); // the original: Safari would skew tones decoding it here
      if (c === N) fd.append('keep', true);
      const a = await api(path, { method, body: fd });
      if (c === N) { // work from the server's small copy from now on
        const r = await fetch('/api/negative/image?' + Date.now());
        if (!r.ok) throw new Error('Could not load the negative.');
        [N.file, N.exif] = [await r.blob(), { aperture: a.aperture, shutter: a.shutter, iso: a.iso }];
      }
      showPhoto(c, c === B ? '/api/benchmark/image?' + Date.now() : URL.createObjectURL(N.file), a);
      if (c === B) saved();
      compute();
    } catch (err) { meta.textContent = err.message; }
  };
}
upload(B, '/benchmark/image', 'PUT');
upload(N, '/analyze', 'POST');

const bStatus = (t) => { $('bStatus').textContent = t; };
const saved = () => { bStatus('Saved ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + '.'); $('bDelete').hidden = false; };

let saveTimer = 0;
B.form.oninput = (e) => {
  if (e.target.type === 'file') return;
  look(B);
  N.form.height.placeholder = B.form.height.value;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const p = readPrint(B.form);
    p.aperture ??= 8;
    try { B.analysis = (await api('/benchmark/print', { method: 'PUT', json: p })).analysis; look(B); saved(); compute(); } // pan re-measures
    catch (err) { bStatus('Not saved: ' + err.message); }
  }, 400);
};
N.form.oninput = (e) => {
  if (e.target.type === 'file') return;
  look(N);
  if (e.target === N.form) measureN(); // rotate / box change moves what's measured
  else compute();
};

$('bDelete').onclick = async () => {
  if (!armed($('bDelete'))) return;
  try { await api('/benchmark', { method: 'DELETE' }); } catch (err) { bStatus(err.message); return; }
  B.form.reset();
  B.analysis = null;
  B.img.hidden = true;
  B.neg = null;
  B.img.parentElement.style.aspectRatio = '';
  B.form.rotation.value = B.form.pan_x.value = B.form.pan_y.value = B.form.portrait.value = 0; // reset() leaves hidden inputs alone
  B.form.querySelector('.tools').hidden = true;
  B.form.querySelector('.photo span').hidden = false;
  B.form.querySelector('.meta').textContent = '';
  N.form.height.placeholder = '';
  $('bDelete').hidden = true;
  bStatus('Benchmark deleted.');
  look(B);
  compute();
};

let seq = 0, lastPrint = null;
async function compute() {
  const my = ++seq, bp = readPrint(B.form), np = readPrint(N.form);
  lastPrint = null;
  $('savePrint').hidden = true;
  np.height ??= bp.height; // blank new fields follow the benchmark
  np.aperture ??= bp.aperture;
  const missing = !B.analysis ? 'Add a benchmark negative.' : !bp.time ? 'Enter the benchmark time.' : !bp.height ? 'Enter the benchmark height.'
    : !N.analysis ? 'Add a new negative to get a time.' : !np.height ? 'Enter the new print height.' : null;
  const show = (t, rows, note) => {
    $('rTime').textContent = t;
    $('rTable').replaceChildren(...rows.map((r) => { const tr = document.createElement('tr'); r.forEach((x) => tr.insertCell().textContent = x); return tr; }));
    $('rNote').textContent = note;
  };
  if (missing) return show('--', [], missing);
  try {
    const r = await api('/exposure', { method: 'POST', json: { analysis: N.analysis, print: np } });
    if (my !== seq) return;
    const s = r.stops;
    lastPrint = { ...np, time: Math.round(r.seconds * 10) / 10 };
    $('savePrint').hidden = false;
    $('savePrint').textContent = 'Save to prints';
    show(fmtTime(r.seconds) + ` at f/${np.aperture}`, [
      ['Benchmark', fmtTime(bp.time) + ` at f/${bp.aperture}`],
      ['Negative density', signed(s.density, ' stops')],
      ['Preview brightness', signed(s.brightness, ' stops')],
      ['Filter', signed(s.filter, ' stops')],
      ['Height', signed(s.height, ' stops')],
      ['Aperture', signed(s.aperture, ' stops')],
    ], r.exif_matched ? '' : 'One photo has no exposure data, so density assumes identical phone settings.');
  } catch (err) { if (my === seq) show('--', [], err.message); }
}

$('savePrint').onclick = async () => {
  if (!lastPrint || !N.file) return;
  const btn = $('savePrint'), fd = photoForm(N);
  fd.append('data', JSON.stringify(lastPrint));
  btn.disabled = true;
  try { await api('/prints', { method: 'POST', body: fd }); btn.textContent = 'Saved ✓'; }
  catch (err) { $('rNote').textContent = 'Not saved: ' + err.message; }
  btn.disabled = false;
};

api('/benchmark').then((rec) => {
  for (const [k, v] of Object.entries(rec.print)) if (B.form[k] && v != null) B.form[k].value = v;
  N.form.height.placeholder = B.form.height.value;
  if (rec.analysis) { showPhoto(B, '/api/benchmark/image?' + Date.now(), rec.analysis); bStatus('Saved on the server.'); $('bDelete').hidden = false; }
}).catch((err) => bStatus(err.message)).finally(() => { look(B); look(N); compute(); settingsReady.then(() => { look(B); look(N); }); });
</script>
</body>
</html>

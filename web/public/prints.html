<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prints</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<main class="wide">
  <header class="top"><h1>Prints</h1><a href="/">← Exposure</a></header>
  <p class="note" id="status">Loading…</p>
  <div id="list" style="display:grid;gap:16px"></div>
</main>

<template id="tpl">
  <form class="card">
    <h2></h2>
    <div class="pair">
      <figure><div class="frame"><img class="neg" alt="Negative"></div><figcaption>Negative</figcaption></figure>
      <figure><div class="frame"><canvas class="adj" role="img" aria-label="Print preview"></canvas></div><figcaption>Print preview</figcaption></figure>
    </div>
    <button type="button" class="rot">Rotate ↺</button> <button type="button" class="box">Box 3:2</button><input type="hidden" name="rotation" value="0"><input type="hidden" name="portrait" value="0"><input type="hidden" name="pan_x" value="0"><input type="hidden" name="pan_y" value="0">
    <p class="note meta"></p>
    <div class="grid">
      <label class="f">Time (s)<input name="time" type="number" min="0" step="0.1" inputmode="decimal"></label>
      <label class="f">Height (in)<input name="height" type="number" min="0" step="0.125" inputmode="decimal"></label>
      <label class="f">Aperture<select name="aperture"></select></label>
      <label class="f">Filter<select name="grade"></select></label>
    </div>
    <label class="f wide">Preview brightness <output>±0</output><input name="brightness" type="range" min="-3" max="3" step="0.3333333" value="0"></label>
    <label class="f wide">Notes<textarea name="notes" maxlength="2000"></textarea></label>
    <p class="note saved"></p>
    <button type="button" class="del">Delete print</button>
  </form>
</template>

<script src="common.js"></script>
<script>
function render(rec) {
  const form = $('tpl').content.firstElementChild.cloneNode(true);
  const q = (s) => form.querySelector(s);
  fillSelects(form, null);
  onRotate(form, q('.rot'));
  onBox(form, q('.box'));
  let neg = null;
  q('.neg').onload = () => look();
  for (const img of [q('.neg'), q('.adj')]) enablePan(img, form, () => look(), () => form.dispatchEvent(new Event('input')));
  q('h2').textContent = new Date(rec.created).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
  q('.neg').src = `/api/prints/${rec.id}/image`;
  loadNegative(q('.neg').src).then((n) => { neg = n; look(); }).catch((err) => { q('.saved').textContent = err.message; });
  q('.meta').textContent = exifLine(rec.analysis);
  for (const [k, v] of Object.entries(rec.print)) if (form[k] && v != null) form[k].value = v;

  const look = () => {
    const p = readPrint(form);
    q('output').value = signed(p.brightness, ' stops');
    q('.box').textContent = boxLabel(p);
    if (neg) renderPrint(q('.adj'), neg, rec.analysis.log_mean, p.brightness, p.grade); // first: sizes the canvas
    placeRotated(q('.neg'), p.rotation, p.pan_x, p.pan_y, p.portrait);
    placeRotated(q('.adj'), p.rotation, p.pan_x, p.pan_y, p.portrait);
  };
  look();

  let timer = 0;
  form.oninput = () => {
    look();
    clearTimeout(timer);
    timer = setTimeout(async () => {
      try {
        rec.analysis = (await api(`/prints/${rec.id}`, { method: 'PUT', json: { ...readPrint(form), notes: form.notes.value } })).analysis;
        look(); // pan re-measures density on the server
        q('.saved').textContent = 'Saved.';
      } catch (err) { q('.saved').textContent = 'Not saved: ' + err.message; }
    }, 400);
  };
  q('.del').onclick = async () => {
    if (!confirm('Delete this print?')) return;
    try { await api(`/prints/${rec.id}`, { method: 'DELETE' }); form.remove(); }
    catch (err) { q('.saved').textContent = err.message; }
  };
  return form;
}

settingsReady.then(() => api('/prints')).then((recs) => {
  $('status').textContent = recs.length ? '' : 'No prints yet. Use “Save to prints” under a calculated time.';
  $('list').replaceChildren(...recs.map(render));
}).catch((err) => { $('status').textContent = err.message; });
</script>
</body>
</html>

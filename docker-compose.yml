services:
  api:
    build: ./api
    volumes:
      - ./api/data:/app/data  # benchmark + prints, visible in the project folder
  web:
    build: ./web
    environment:
      - API_URL=http://api:8000
    volumes:
      - ./web/public:/app/public  # live UI edits: save, then refresh the browser
    ports:
      - "8080:3000"
    depends_on:
      - api
